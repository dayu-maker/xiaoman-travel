<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5C4B1"/>
      <stop offset="100%" stop-color="#A8B8C8"/>
    </linearGradient>
    <linearGradient id="gk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7DCA0"/>
      <stop offset="100%" stop-color="#E8B86A"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：豆沙绿 → 雾霾蓝 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/>

  <!-- 一轮暖色小太阳（呼应「小满」的节气感） -->
  <circle cx="392" cy="118" r="46" fill="url(#gk)" opacity=".95"/>

  <!-- 麦穗：两根麦秆 + 麦粒 -->
  <g stroke="#FBF6EC" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M256 412 L256 214"/>
    <path d="M256 300 L196 250"/>
    <path d="M256 262 L316 212"/>
  </g>
  <g fill="#FBF6EC">
    <ellipse cx="238" cy="196" rx="20" ry="29" transform="rotate(-18 238 196)"/>
    <ellipse cx="274" cy="196" rx="20" ry="29" transform="rotate(18 274 196)"/>
    <ellipse cx="214" cy="238" rx="17" ry="25" transform="rotate(-26 214 238)"/>
    <ellipse cx="298" cy="238" rx="17" ry="25" transform="rotate(26 298 238)"/>
    <ellipse cx="200" cy="282" rx="14" ry="21" transform="rotate(-34 200 282)"/>
    <ellipse cx="312" cy="282" rx="14" ry="21" transform="rotate(34 312 282)"/>
  </g>

  <!-- 地面弧线：暗示「出行」的路 -->
  <path d="M120 420 Q256 384 392 420" stroke="#FBF6EC" stroke-width="12" fill="none" opacity=".55" stroke-linecap="round"/>
</svg>
